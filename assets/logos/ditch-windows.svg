<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="ditch-windows">
  <!-- trash can -->
  <rect x="33" y="36" width="14" height="20" fill="#f4f2ee" stroke="#050505" stroke-width="2" rx="1"/>
  <rect x="31" y="32" width="18" height="6" fill="#050505"/>
  <!-- stick figure head -->
  <circle cx="25" cy="16" r="4" fill="#050505"/>
  <!-- body -->
  <path d="M25 20v11" stroke="#050505" stroke-width="3" stroke-linecap="round"/>
  <!-- legs -->
  <path d="M25 31L19 39" stroke="#050505" stroke-width="3" stroke-linecap="round"/>
  <path d="M25 31L31 39" stroke="#050505" stroke-width="3" stroke-linecap="round"/>
  <!-- throwing arm -->
  <path d="M27 22L45 18" stroke="#050505" stroke-width="4" stroke-linecap="round"/>
  <!-- Windows logo (4 panes, red/white only) -->
  <g transform="translate(36, 10)">
    <rect x="0" y="0" width="14" height="14" fill="#050505"/>
    <rect x="7" y="0" width="7" height="7" fill="#f4f2ee"/>
    <rect x="0" y="7" width="7" height="7" fill="#f4f2ee"/>
    <rect x="7" y="7" width="7" height="7" fill="#f4f2ee"/>
    <path d="M7 0v14M0 7h14" stroke="#050505" stroke-width="1"/>
  </g>
  <!-- red accent swoosh -->
  <path d="M45 18L52 14L45 10" stroke="#78080f" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
