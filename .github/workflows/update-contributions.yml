name: Refresh GitHub contributions

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate assets/data/github.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_LOGIN: mithun-srinivasan
        run: node .github/scripts/generate-contributions.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/github.json
          git diff --cached --quiet || git commit -m "refresh: update github contributions calendar"
          git push
