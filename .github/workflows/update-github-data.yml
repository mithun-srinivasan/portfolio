name: Update GitHub contribution data

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub data and update github.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: mithun-srinivasan
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = "assets/data/github.json";
          const login = process.env.GH_LOGIN;
          const token = process.env.GITHUB_TOKEN;
          const now = new Date();
          const from = new Date(now.getFullYear() - 1, 0, 1).toISOString();
          const to = now.toISOString();

          const query = `query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar {
                  totalContributions
                  weeks { contributionDays { date contributionCount color } }
                }
              }
              repositories(privacy: PUBLIC, first: 100) { totalCount }
            }
          }`;

          const res = await fetch("https://api.github.com/graphql", {
            method: "POST",
            headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ query, variables: { login, from, to } })
          });
          const json = await res.json();
          if (json.errors) { console.error(json.errors); process.exit(1); }

          const user = json.data.user;
          const cal = user.contributionsCollection.contributionCalendar;
          const days = cal.weeks.flatMap(w =>
            w.contributionDays.map(d => [d.date, d.contributionCount, d.color])
          );

          const data = {
            generated: now.toISOString().slice(0, 10),
            contributions: cal.totalContributions,
            repos: user.repositories.totalCount,
            days
          };

          const prev = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, "utf8")) : {};
          if (JSON.stringify(prev) === JSON.stringify(data)) {
            console.log("No changes.");
            process.exit(0);
          }

          fs.writeFileSync(path, JSON.stringify(data) + "\n");
          console.log("Updated github.json:", data.contributions, "contributions", data.repos, "repos");
          NODE

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/github.json
          git diff --cached --quiet || git commit -m "chore: refresh github contribution data $(date +%F)"
          git push
